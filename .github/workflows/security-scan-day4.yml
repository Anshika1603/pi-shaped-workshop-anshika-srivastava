name: Security Scans (day4 app)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies (inside day4)
        run: |
          cd Security_Compliance_workshop-anshika-srivastava/day4
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

  bandit_scan:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Install bandit
        run: |
          cd Security_Compliance_workshop-anshika-srivastava/day4
          pip install bandit
      - name: Run bandit
        run: |
          cd Security_Compliance_workshop-anshika-srivastava/day4
          bandit -r . -f html -o bandit-report.html || true
      - name: Upload bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: Security_Compliance_workshop-anshika-srivastava/day4/bandit-report.html

  semgrep_scan:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Install semgrep
        run: |
          cd Security_Compliance_workshop-anshika-srivastava/day4
          pip install semgrep
      - name: Run semgrep
        run: |
          cd Security_Compliance_workshop-anshika-srivastava/day4
          semgrep --config auto --json > semgrep-report.json || true
      - name: Upload semgrep report
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: Security_Compliance_workshop-anshika-srivastava/day4/semgrep-report.json

  trivy_scan:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Install Trivy CLI reliably
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh
      - name: Verify Trivy
        run: trivy --version
      - name: Run Trivy filesystem scan (HTML)
        run: |
          cd Security_Compliance_workshop-anshika-srivastava/day4
          trivy fs --format template --template '@contrib/html.tpl' -o trivy-report.html . || true
      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: Security_Compliance_workshop-anshika-srivastava/day4/trivy-report.html

  zap_scan:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          cd Security_Compliance_workshop-anshika-srivastava/day4
          pip install -r requirements.txt
      - name: Start Flask app in background
        run: |
          cd Security_Compliance_workshop-anshika-srivastava/day4
          python vulnerable-app.py & sleep 5
      - name: Pull ZAP image (stable version)
        run: docker pull owasp/zap2docker-stable:2.14.0
      - name: Run ZAP baseline scan
        run: |
          cd Security_Compliance_workshop-anshika-srivastava/day4
          docker run --rm -v $(pwd):/zap/wrk/:Z owasp/zap2docker-stable:2.14.0 zap-baseline.py -t http://host.docker.internal:5000 -r zap-report.html || true
      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: Security_Compliance_workshop-anshika-srivastava/day4/zap-report.html  