name: Flask Security Pipeline Day4

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  security_pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # ------------------------------
      # Build: Install Dependencies
      # ------------------------------
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          cd Security_Compliance_workshop-anshika-srivastava/day4
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ------------------------------
      # Bandit Scan
      # ------------------------------
      - name: Run Bandit security scan
        run: |
          cd Security_Compliance_workshop-anshika-srivastava/day4
          pip install bandit
          bandit -r . -f html -o bandit-report.html

      - name: Upload Bandit Report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: Security_Compliance_workshop-anshika-srivastava/day4/bandit-report.html

      # ------------------------------
      # Semgrep Scan
      # ------------------------------
      - name: Run Semgrep scan
        uses: returntocorp/semgrep-action@v2
        with:
          config: "p/ci"
          output: Security_Compliance_workshop-anshika-srivastava/day4/semgrep-report.json
          sarif: Security_Compliance_workshop-anshika-srivastava/day4/semgrep-report.sarif

      - name: Upload Semgrep Report
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: |
            Security_Compliance_workshop-anshika-srivastava/day4/semgrep-report.json
            Security_Compliance_workshop-anshika-srivastava/day4/semgrep-report.sarif

      # ------------------------------
      # Trivy Scan (Python dependencies)
      # ------------------------------
      - name: Install Trivy
        uses: aquasecurity/trivy-action@v1
        with:
          scan-type: 'fs'
          format: 'table'
          exit-code: '0'
          vuln-type: 'os,library'
          ignore-unfixed: true
          path: Security_Compliance_workshop-anshika-srivastava/day4

      # ------------------------------
      # OWASP ZAP Scan
      # ------------------------------
      - name: Start Flask app
        run: |
          cd Security_Compliance_workshop-anshika-srivastava/day4
          nohup flask run --host=0.0.0.0 --port=5000 &
          echo "Waiting for Flask app to start..."
          for i in {1..15}; do
            curl -sSf http://127.0.0.1:5000 && break
            sleep 2
          done

      - name: Run ZAP Baseline Scan
        continue-on-error: true
        run: |
          docker run --rm -v ${{ github.workspace }}/Security_Compliance_workshop-anshika-srivastava/day4:/zap/wrk \
            ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t http://127.0.0.1:5000/ \
            -g gen.conf \
            -J zap-report.json \
            -w zap-report.md \
            -r zap-report.html

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: |
            Security_Compliance_workshop-anshika-srivastava/day4/zap-report.html
            Security_Compliance_workshop-anshika-srivastava/day4/zap-report.md
            Security_Compliance_workshop-anshika-srivastava/day4/zap-report.json