name: Security Scans (day4 Flask App)

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies (inside day4)
        run: |
          cd Security_Compliance_workshop-anshika-srivastava/day4
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

  bandit_scan:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install bandit
        run: |
          cd Security_Compliance_workshop-anshika-srivastava/day4
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run bandit (HTML) inside day4
        run: |
          cd Security_Compliance_workshop-anshika-srivastava/day4
          bandit -r . -f html -o bandit-report.html || true

      - name: Upload bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: Security_Compliance_workshop-anshika-srivastava/day4/bandit-report.html

  semgrep_scan:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install semgrep
        run: |
          cd Security_Compliance_workshop-anshika-srivastava/day4
          python -m pip install --upgrade pip
          pip install semgrep

      - name: Run semgrep (JSON) inside day4
        run: |
          cd Security_Compliance_workshop-anshika-srivastava/day4
          semgrep --config auto --json > semgrep-report.json || true

      - name: Upload semgrep report
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: Security_Compliance_workshop-anshika-srivastava/day4/semgrep-report.json

  trivy_scan:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install trivy CLI
        run: |
          cd Security_Compliance_workshop-anshika-srivastava/day4
          wget -qO- https://github.com/aquasecurity/trivy/releases/latest/download/trivy_0.44.0_Linux-64bit.tar.gz | tar xz
          sudo mv trivy /usr/local/bin/ || true

      - name: Trivy filesystem scan (HTML) inside day4
        run: |
          cd Security_Compliance_workshop-anshika-srivastava/day4
          trivy fs --format template --template '@contrib/html.tpl' -o trivy-report.html . || true

      - name: Upload trivy report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: Security_Compliance_workshop-anshika-srivastava/day4/trivy-report.html

  zap_scan:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python & install deps (inside day4)
        run: |
          cd Security_Compliance_workshop-anshika-srivastava/day4
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start Flask app in background (inside day4)
        run: |
          cd Security_Compliance_workshop-anshika-srivastava/day4
          # start the app file explicitly (vulnerable-app.py)
          python vulnerable-app.py & 
          sleep 5

      - name: Pull ZAP image
        run: docker pull owasp/zap2docker-stable

      - name: Run ZAP baseline scanner against runner-hosted app
        run: |
          cd Security_Compliance_workshop-anshika-srivastava/day4
          # ZAP container uses host.docker.internal to reach the runner host
          docker run --rm -v $(pwd):/zap/wrk/:Z owasp/zap2docker-stable zap-baseline.py -t http://host.docker.internal:5000 -r zap-report.html || true

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: Security_Compliance_workshop-anshika-srivastava/day4/zap-report.html