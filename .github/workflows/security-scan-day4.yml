name: Flask Security Pipeline Day4

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  security_pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # ------------------------------
      # Build: Install Dependencies
      # ------------------------------
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: Security_Compliance_workshop-anshika-srivastava/day4

      # ------------------------------
      # Bandit Scan
      # ------------------------------
      - name: Run Bandit security scan
        run: |
          pip install bandit
          bandit -r . -f html -o bandit-report.html
        working-directory: Security_Compliance_workshop-anshika-srivastava/day4

      - name: Upload Bandit Report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: Security_Compliance_workshop-anshika-srivastava/day4/bandit-report.html

      # ------------------------------
      # Semgrep Scan (using CLI for JSON and SARIF outputs)
      # ------------------------------
      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep scan
        run: |
          semgrep --config=p/ci --json --output=semgrep-report.json
          semgrep --config=p/ci --sarif --output=semgrep-report.sarif
        working-directory: Security_Compliance_workshop-anshika-srivastava/day4

      - name: Upload Semgrep Report
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: |
            Security_Compliance_workshop-anshika-srivastava/day4/semgrep-report.json
            Security_Compliance_workshop-anshika-srivastava/day4/semgrep-report.sarif

      # ------------------------------
      # Trivy Scan (Python dependencies)
      # ------------------------------
      - name: Run Trivy FS scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          format: 'html'
          output: Security_Compliance_workshop-anshika-srivastava/day4/trivy-report.html
          vuln-type: 'os,library'
          ignore-unfixed: true
          path: Security_Compliance_workshop-anshika-srivastava/day4
          exit-code: '0'

      - name: Upload Trivy Report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: Security_Compliance_workshop-anshika-srivastava/day4/trivy-report.html

      # ------------------------------
      # OWASP ZAP Scan
      # ------------------------------
      - name: Start Flask app
        run: |
          nohup flask run --host=0.0.0.0 --port=5000 &
          echo "Waiting for Flask app to start..."
          for i in {1..15}; do
            curl -sSf http://127.0.0.1:5000 && break
            sleep 2
          done
        working-directory: Security_Compliance_workshop-anshika-srivastava/day4

      - name: Run ZAP Baseline Scan
        continue-on-error: true
        run: |
          docker run --rm --add-host=host.docker.internal:host-gateway \
            -v ${{ github.workspace }}/Security_Compliance_workshop-anshika-srivastava/day4:/zap/wrk \
            ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t http://host.docker.internal:5000/ \
            -g gen.conf \
            -J zap-report.json \
            -w zap-report.md \
            -r zap-report.html
        working-directory: Security_Compliance_workshop-anshika-srivastava/day4

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: |
            Security_Compliance_workshop-anshika-srivastava/day4/zap-report.html
            Security_Compliance_workshop-anshika-srivastava/day4/zap-report.md
            Security_Compliance_workshop-anshika-srivastava/day4/zap-report.json